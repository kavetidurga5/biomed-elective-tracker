<style>
  :root {
    --navy:  #003087;
    --teal:  #028090;
    --gold:  #E8A020;
    --green: #1E9E5A;
    --amber: #D9A400;
    --red:   #D0453A;
    --steel: #E8EDF2;
    --mist:  #F4F7FA;
    --ink:   #1A2333;
    --slate: #4A5568;
    --ghost: #8A9AB0;
    --white: #FFFFFF;
    --r:     12px;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--mist); color: var(--ink); margin: 0; }

  .dash-wrap { max-width: 1080px; margin: 0 auto; padding: 40px 32px 80px; }

  .dash-grid { display: grid; grid-template-columns: 1fr; gap: 24px; margin-bottom: 24px; }

  .card { background: var(--white); border-radius: var(--r); border: 1px solid #E4E9F0; padding: 24px 26px; }
  .card-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--teal); margin: 0 0 10px; }
  .card h2 { font-family: 'DM Serif Display', serif; font-size: 22px; margin: 0 0 6px; color: var(--ink); }
  .card h3 { font-size: 15px; margin: 0 0 4px; color: var(--ink); }

  /* Where We Are Now */
  .week-card { background: linear-gradient(135deg, var(--navy), #0A4AA8); color: var(--white); margin-bottom: 24px; padding: 32px 40px; }
  .week-card .card-eyebrow { color: rgba(255,255,255,0.6); }
  .week-card h2 { color: var(--white); font-size: 28px; }
  .week-topic { font-size: 15px; color: rgba(255,255,255,0.82); margin: 0 0 20px; max-width: 640px; }
  .week-progress-track { background: rgba(255,255,255,0.16); border-radius: 100px; height: 8px; overflow: hidden; margin-bottom: 8px; }
  .week-progress-fill { background: var(--gold); height: 100%; border-radius: 100px; transition: width 0.4s ease; }
  .week-progress-label { font-size: 12px; color: rgba(255,255,255,0.62); display: flex; justify-content: space-between; }
  .week-stage-pill { display: inline-block; margin-top: 16px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.24); border-radius: 100px; padding: 5px 14px; font-size: 12px; font-weight: 600; }

  .presentation-item { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; border-bottom: 1px solid #EEF1F5; }
  .presentation-item:last-child { border-bottom: none; }
  .presentation-date { font-size: 12px; color: var(--slate); white-space: nowrap; margin-left: 12px; }

  .state-message { font-size: 13px; color: var(--ghost); padding: 8px 0; }
</style>
</head>

<footer style="background: var(--ink); padding: 30px 48px; text-align:center;">
  <p style="font-size:11px; color: rgba(255,255,255,0.24); letter-spacing:0.05em;">
    ENRH 116 &nbsp;·&nbsp; UT Southwestern Medical School &nbsp;·&nbsp; Kaveti · Zhao · Wu · Garlapati
  </p>
  <p id="last-synced" style="font-size:10.5px; color: rgba(255,255,255,0.18); letter-spacing:0.05em; margin-top:8px;">
    Syncing…
  </p>
</footer>

<script src="assets/js/sheets.js"></script>
<script>
  // escapeHtml and safeLink are defined once, in assets/js/sheets.js, and
  // loaded globally via <script src="assets/js/sheets.js"> above. They
  // used to be duplicated in each of the three pages; this is the shared
  // copy.

  // parseGvizDate is defined once, in assets/js/sheets.js, and loaded
  // globally via <script src="assets/js/sheets.js"> above. It used to be
  // duplicated here and in project.html; this is the shared copy.

  function fmtDate(dt) {
    if (!dt) return "TBD";
    return dt.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }

  // Render a visible failure. Distinct from the empty state on purpose:
  // "we could not load this" must never look like "there is nothing here".
  function renderError(el, what, err) {
    console.error(what, err);
    const hint = err && err.reason === "envelope"
      ? "The sheet may no longer be shared publicly."
      : "Check your connection, or whether the tracker sheet is still shared.";
    el.innerHTML =
      `<div class="state-error"><strong>Couldn't load ${escapeHtml(what)}.</strong>${escapeHtml(hint)} This is a loading failure, not an empty list.</div>`;
  }

  // Stamp the footer once anything has successfully loaded.
  function markSynced() {
    const el = document.getElementById("last-synced");
    const t = typeof getLastSyncedAt === "function" ? getLastSyncedAt() : null;
    if (!el) return;
    el.textContent = t
      ? `Last synced ${t.toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}`
      : "Not synced — data below may be missing";
  }

  function markSyncFailed() {
    const el = document.getElementById("last-synced");
    if (el) el.textContent = "Sync failed — some data on this page did not load";
  }

  // Fixed deliverable dates from the syllabus (Section III). Hardcoded
  // since these are set once for the semester, not tracked in a sheet tab.
  const DELIVERABLES = [
    { date: new Date(2026, 8, 8),  label: "Project Preference Ranking due" },
    { date: new Date(2026, 8, 9),  label: "Team Formation due" },
    { date: new Date(2026, 9, 1),  label: "Project Proposal due" },
    { date: new Date(2026, 9, 22), label: "Mid-Semester Progress Check-In due" },
    { date: new Date(2026, 10, 26), label: "Pitch Presentation due" },
  ];

  // ── Where We Are Now ──────────────────────────────────────────
  // Pure: classify where "today" sits relative to the syllabus weeks.
  // Extracted so pre-semester/mid-semester/post-semester selection is
  // testable without a DOM.
  function classifyWeekState(weeks, today) {
    if (!weeks.length) return { state: "no-data" };
    const firstWeek = weeks[0];
    const lastWeek = weeks[weeks.length - 1];
    if (today < firstWeek.date) return { state: "pre-semester", firstWeek, lastWeek };
    if (today > lastWeek.date) return { state: "post-semester", firstWeek, lastWeek };
    let currentIndex = 0;
    weeks.forEach((w, i) => { if (w.date <= today) currentIndex = i; });
    return { state: "in-progress", current: weeks[currentIndex], currentIndex, totalWeeks: weeks.length };
  }

  withTimeout(fetchTab(GIDS.syllabus), 15000, "syllabus").then(rows => {
    const today = new Date();
    today.setHours(0,0,0,0);

    const weeks = rows
      .map(r => ({
        week: r["Week"],
        date: parseGvizDate(r["Date"]),
        topic: r["Topic"],
        stage: r["Expected Stage"],
        note: r["Agenda Note"] || "",
      }))
      .filter(w => w.date)
      .sort((a, b) => a.date - b.date);

    if (!weeks.length) {
      document.getElementById("week-heading").textContent = "Syllabus not loaded";
      renderUpcoming(buildUpcomingEvents([], DELIVERABLES, today));
      return;
    }

    renderUpcoming(buildUpcomingEvents(weeks, DELIVERABLES, today));

    const classification = classifyWeekState(weeks, today);
    const totalWeeks = weeks.length;

    // Pre-semester: the "last week whose date <= today" scan finds nothing
    // before the semester starts and would otherwise silently default to
    // index 0, claiming "Week 1" before the course had even begun.
    if (classification.state === "pre-semester") {
      const { firstWeek, lastWeek } = classification;
      document.getElementById("week-heading").textContent = "Course starts soon";
      document.getElementById("week-topic").textContent =
        `First session: ${fmtDate(firstWeek.date)} — ${firstWeek.topic || ""}`;
      document.getElementById("week-progress-fill").style.width = "0%";
      document.getElementById("week-progress-label").innerHTML = `<span>Not started yet</span>`;
      document.getElementById("week-stage-pill").outerHTML =
        `<span class="week-stage-pill" id="week-stage-pill">Expected Stage: —</span>`;
      document.getElementById("week-end-label").textContent = `Pitch Day: ${fmtDate(lastWeek.date)}`;
      markSynced();
      return;
    }

    // Post-semester: the scan otherwise clamps to the last index forever
    // once the final week passes, claiming "Week 12 of 12" indefinitely
    // with no indication the course had actually ended.
    if (classification.state === "post-semester") {
      const { lastWeek } = classification;
      document.getElementById("week-heading").textContent = "Semester complete";
      document.getElementById("week-topic").textContent =
        `Final session: ${lastWeek.topic || ""} (${fmtDate(lastWeek.date)})`;
      document.getElementById("week-progress-fill").style.width = "100%";
      document.getElementById("week-progress-label").innerHTML =
        `<span>Week ${totalWeeks} of ${totalWeeks} — complete</span>`;
      document.getElementById("week-stage-pill").outerHTML =
        `<span class="week-stage-pill" id="week-stage-pill">Expected Stage: Complete</span>`;
      document.getElementById("week-end-label").textContent = `Pitch Day: ${fmtDate(lastWeek.date)}`;
      markSynced();
      return;
    }

    const current = classification.current;
    const currentIndex = classification.currentIndex;

    const pct = Math.round(((parseFloat(current.week) || 0) / totalWeeks) * 100);

    document.getElementById("week-heading").textContent = `Week ${current.week} of ${totalWeeks}`;
    document.getElementById("week-topic").textContent = current.note
      ? `${current.topic} — ${current.note}`
      : (current.topic || "");
    document.getElementById("week-progress-fill").style.width = pct + "%";
    document.getElementById("week-progress-label").innerHTML =
      `<span>Week ${current.week} of ${totalWeeks}</span>`;

    const next = weeks[currentIndex + 1];
    const windowEnd = next ? next.date : new Date(current.date.getTime() + 7*24*60*60*1000);
    const dueThisWeek = DELIVERABLES.filter(d => d.date >= current.date && d.date < windowEnd);

    const stagePillHtml = `<span class="week-stage-pill">Expected Stage: ${escapeHtml(current.stage) || "—"}</span>`;
    const deliverableHtml = dueThisWeek.map(d =>
      `<span class="week-stage-pill" style="background:rgba(232,160,32,0.22); border-color:rgba(232,160,32,0.4);">${escapeHtml(d.label)}</span>`
    ).join("");
    document.getElementById("week-stage-pill").outerHTML = `<div style="margin-top:16px; display:flex; gap:10px; flex-wrap:wrap;">${stagePillHtml}${deliverableHtml}</div>`;

    const last = weeks[weeks.length - 1];
    document.getElementById("week-end-label").textContent = `${last.topic && last.topic.includes("Pitch") ? "Pitch Day" : "Final week"}: ${fmtDate(last.date)}`;
    markSynced();
  }).catch(err => {
    console.error(err);
    document.getElementById("week-heading").textContent = "Couldn't load syllabus";
    document.getElementById("week-topic").textContent =
      "The tracker sheet did not load. The week shown may be stale or absent — this is a failure, not an empty schedule.";
    renderError(document.getElementById("presentations-list"), "upcoming events", err);
    markSyncFailed();
  });

  // ── Dashboard stats (Active projects / Needs attention) and the
  //    "Immediate Alerts" cross-team panel were removed from this page
  //    (2026-09-18) now that teams can navigate here directly via their
  //    own project link — showing every team's health and open support
  //    requests in one place was no longer appropriate for a page
  //    reachable by students, not just admins. The equivalent info now
  //    lives per-project on each team's own Team Needs tab.
  //
  //    computeDashboardStats() / isResolved() / selectAlerts() /
  //    sheetRowLink() below are the pure functions that used to drive
  //    those panels. They're kept, untouched and still tested (P1-7,
  //    p0-3, p0-4-mitigation, resolve-queue-link), in case this or a
  //    similar admin-only view gets rebuilt later — removing them now
  //    would mean rewriting the same logic from scratch rather than
  //    just calling it again.
  function computeDashboardStats(dashboardRows, updateLogRows, today) {
    const active = dashboardRows.filter(r => {
      const name = (r["Project"] || "").trim();
      if (!name) return false;
      return (r["Project Status"] || "").trim().toLowerCase() !== "complete";
    });
    const needsAttention = active.filter(r => {
      const days = daysSinceLastUpdate(updateLogRows, r["Project"], today);
      const level = stalenessLevel(days);
      return level === "red" || level === "never";
    });
    return { activeCount: active.length, needsAttentionCount: needsAttention.length };
  }

  function isResolved(r) {
    return (r["Status"] || "").trim().toLowerCase() === "resolved";
  }

  // Pure: selects the OPEN alert rows to render, and separately counts
  // resolved ones so they can be shown as a quiet tally instead of either
  // disappearing entirely or clogging the open list forever.
  function selectAlerts(rows, limit) {
    const matching = rows
      // No `|| new Date(r["Timestamp"])` fallback here: gviz returns null
      // for an empty Timestamp cell, and new Date(null) is 1970-01-01 — a
      // valid Date that survives the isNaN filter and renders as a 1970
      // alert on the public dashboard. parseGvizDate already handles every
      // date format present in this workbook, so a null result means the
      // row genuinely has no usable date and must be dropped.
      .map(r => ({ ...r, _ts: parseGvizDate(r["Timestamp"]) }))
      .filter(r => {
        const type = (r["Entry Type"] || "").toLowerCase();
        return type.includes("admin") || type.includes("blocker");
      })
      .filter(r => r._ts instanceof Date && !isNaN(r._ts));

    const open = matching.filter(r => !isResolved(r));
    const resolvedCount = matching.length - open.length;

    return {
      alerts: open.sort((a, b) => b._ts - a._ts).slice(0, limit),
      resolvedCount,
    };
  }

  // Deep-link straight to a row's Status cell in the actual sheet, so
  // clearing the queue doesn't mean hunting for the right row by hand.
  // gviz is called with headers=1 (see fetchTab), so row 1 is always the
  // header and data row i (0-indexed) is always sheet row i+2 — no
  // reordering happens before this point, so the index is reliable.
  function sheetRowLink(gid, rowNum) {
    return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit#gid=${gid}&range=A${rowNum}`;
  }

  // ── Upcoming: guest speakers, workshops, symposium ──────────────
  // Previously a hardcoded array duplicating the Syllabus Map tab — a
  // rescheduled guest speaker would make the dashboard lie. Now derived
  // live from the same `weeks` array the week card already builds, keyed
  // off keywords in each week's Topic.
  //
  // DELIVERABLES stays hardcoded below: the Syllabus Map tab has no
  // per-deliverable rows, and a live Deliverables tab is a schema change
  // under Durga's action (brief §5, unblocks M-3). Flagging rather than
  // half-fixing: this is the one remaining hardcoded course-date source.
  function classifyEventType(topic) {
    const t = (topic || "").toLowerCase();
    if (t.includes("guest speaker")) return "Guest Speaker";
    if (t.includes("pitch day") || t.includes("symposium")) return "Symposium";
    if (t.includes("workshop")) return "Workshop";
    return "Class Session";
  }

  function buildUpcomingEvents(weeks, deliverables, today) {
    const courseEvents = weeks
      .filter(w => /guest speaker|workshop|symposium|pitch day/i.test(w.topic || ""))
      .map(w => ({ date: w.date, label: w.topic, type: classifyEventType(w.topic) }));
    const deliverableEvents = deliverables.map(d => ({ date: d.date, label: d.label, type: "Deliverable" }));
    return [...courseEvents, ...deliverableEvents]
      .filter(e => e.date && e.date >= today)
      .sort((a, b) => a.date - b.date);
  }

  function renderUpcoming(events) {
    const container = document.getElementById("presentations-list");
    if (!events.length) {
      container.innerHTML = `<p class="state-message">Nothing left on the schedule.</p>`;
      return;
    }
    container.innerHTML = events.map(e => `
      <div class="presentation-item">
        <div>
          <div style="font-size:13.5px; font-weight:500;">${escapeHtml(e.label)}</div>
          <div style="font-size:12px; color:var(--ghost);">${escapeHtml(e.type)}</div>
        </div>
        <div class="presentation-date">${fmtDate(e.date)}</div>
      </div>`).join("");
  }
</script>
